app = "dentalbot-odontologia"
primary_region = "mia"   # Miami — más cerca de Perú

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # NO apagar nunca
  auto_start_machines = true
  min_machines_running = 1     # Siempre 1 instancia activa

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[mounts]]
  source = "dentalbot_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

